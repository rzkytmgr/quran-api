name: NodeJS version matrix testing

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: initiate nodejs
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: nodejs version
        run: |
          node -v

      - name: install dependencies
        run: |
          pnpm install

      - name: testing
        run: |
          pnpm dev:test
          pnpm dev:format:check
          pnpm dev:lint
          pnpm build
          echo "All tests passed!"
